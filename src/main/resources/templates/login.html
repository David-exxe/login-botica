<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Botica Salud Ica</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8f5e9; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px 40px; border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0,0,0,.15); width: 300px; }
        h2 { color: #2e7d32; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 10px; background: #2e7d32;
                 color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: #c62828; text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h2>Botica "Salud Ica"</h2>
    <form th:action="@{/login}" method="post">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required>
        <label for="clave">Clave</label>
        <input type="password" id="clave" name="clave" required>
        <button type="submit">Ingresar</button>
    </form>
    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
